# Read by [PrereqsFile] in dist.ini, for prerequisites [AutoPrereqs] cannot find
# in the code.  The perl floor is here as well as on the use line of every file,
# so the metadata states it even where one file leaves that line out.
runtime:
  requires:
    perl: '5.040'
    # bin/tpsgi loads it in each worker, by a require that AutoPrereqs does not
    # read, because that file's shebang is bin/tarbaby rather than perl.
    Devel::NYTProf: '0'
